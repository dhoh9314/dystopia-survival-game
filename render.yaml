services:
  - type: web
    name: dystopia-survival-game
    runtime: node
    plan: free
    buildCommand: "cd client && npm install --include=dev && npm run build && cd ../server && npm install --include=dev"
    startCommand: "cd server && npm run migrate:turso && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
